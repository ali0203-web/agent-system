<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Trading Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-rows: 80px 1fr 80px;
            height: 100vh;
            gap: 0;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .header-stats {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        /* Main Content */
        .content {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .agents-grid::-webkit-scrollbar {
            width: 8px;
        }

        .agents-grid::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        .agents-grid::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .agents-grid::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Agent Card */
        .agent-card {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .agent-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 16px rgba(14, 165, 233, 0.1);
            transform: translateY(-2px);
        }

        .agent-card.running {
            border-left: 3px solid var(--success);
        }

        .agent-card.idle {
            border-left: 3px solid var(--warning);
        }

        .agent-card.error {
            border-left: 3px solid var(--danger);
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .agent-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
        }

        .agent-status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .agent-status-badge.running {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .agent-status-badge.idle {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .agent-status-badge.error {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .agent-details {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .agent-metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .agent-metric-value {
            color: var(--primary);
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: var(--bg-primary);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-title {
            padding: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
        }

        .activity-feed {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .activity-feed::-webkit-scrollbar {
            width: 6px;
        }

        .activity-feed::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .activity-feed::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .activity-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .activity-item.buy {
            border-left: 3px solid var(--success);
        }

        .activity-item.sell {
            border-left: 3px solid var(--danger);
        }

        .activity-item.alert {
            border-left: 3px solid var(--warning);
        }

        .activity-time {
            color: var(--text-secondary);
            font-size: 10px;
            display: block;
            margin-top: 4px;
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .footer-left {
            display: flex;
            gap: 30px;
        }

        .footer-stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-stat-label {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .footer-stat-value {
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
        }

        .connection-dot.disconnected {
            background-color: var(--danger);
            animation: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-left">
                <div class="logo">⚡ AgentOS</div>
                <div class="header-title">Trading Orchestrator</div>
                <div class="status-indicator"></div>
            </div>
            <div class="header-stats">
                <div class="stat">
                    <div class="stat-label">Active Agents</div>
                    <div class="stat-value" id="activeAgents">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Executions/min</div>
                    <div class="stat-value" id="execPerMin">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Total P&L</div>
                    <div class="stat-value" id="totalPnL">$0.00</div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content">
            <!-- Agents Grid -->
            <div>
                <h2 style="margin-bottom: 15px; font-size: 16px; color: var(--text-secondary);">Agent Fleet</h2>
                <div class="agents-grid" id="agentsGrid"></div>
            </div>

            <!-- Sidebar with Activity Feed -->
            <div class="sidebar">
                <div class="sidebar-title">Live Activity</div>
                <div class="activity-feed" id="activityFeed"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="footer-left">
                <div class="footer-stat">
                    <div class="footer-stat-label">Total Trades</div>
                    <div class="footer-stat-value" id="totalTrades">0</div>
                </div>
                <div class="footer-stat">
                    <div class="footer-stat-label">Uptime</div>
                    <div class="footer-stat-value" id="uptime">00:00</div>
                </div>
            </div>
            <div class="connection-status">
                <div class="connection-dot" id="connectionDot"></div>
                <span id="connectionText">Connected</span>
            </div>
        </footer>
    </div>

    <script>
        let ws;
        let agents = {};
        let events = [];
        let startTime = Date.now();

        function initWebSocket() {
            ws = new WebSocket(`ws://${window.location.host}`);

            ws.onopen = () => {
                console.log('Dashboard connected');
                document.getElementById('connectionDot').className = 'connection-dot';
                document.getElementById('connectionText').textContent = 'Connected';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };

            ws.onclose = () => {
                console.log('Dashboard disconnected');
                document.getElementById('connectionDot').className = 'connection-dot disconnected';
                document.getElementById('connectionText').textContent = 'Disconnected';
                setTimeout(initWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function handleMessage(data) {
            if (data.type === 'initial') {
                agents = {};
                data.orchestrator.agents.forEach((agent) => {
                    agents[agent.id] = agent;
                });
                events = data.events || [];
                render();
            } else if (data.type === 'status-update') {
                data.orchestrator.agents.forEach((agent) => {
                    agents[agent.id] = agent;
                });
                render();
            } else {
                events.push(data);
                if (events.length > 100) events.shift();
                renderActivityFeed();
                renderHeader();
            }
        }

        function render() {
            renderAgents();
            renderHeader();
            renderActivityFeed();
            renderFooter();
        }

        function renderAgents() {
            const grid = document.getElementById('agentsGrid');
            grid.innerHTML = Object.values(agents)
                .map((agent) => createAgentCard(agent))
                .join('');
        }

        function createAgentCard(agent) {
            const status = agent.isRunning ? 'running' : 'idle';
            const uptime = agent.lastRun ? Math.floor((Date.now() - new Date(agent.lastRun).getTime()) / 1000) : 0;

            return `
                <div class="agent-card ${status}">
                    <div class="agent-header">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-status-badge ${status}">${status}</div>
                    </div>
                    <div class="agent-details">
                        <div class="agent-metric">
                            <span>Schedule:</span>
                            <span class="agent-metric-value">${agent.schedule}</span>
                        </div>
                        <div class="agent-metric">
                            <span>Last Run:</span>
                            <span class="agent-metric-value">${uptime}s ago</span>
                        </div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min((uptime / 60) * 100, 100)}%"></div>
                    </div>
                </div>
            `;
        }

        function renderActivityFeed() {
            const feed = document.getElementById('activityFeed');
            feed.innerHTML = events
                .slice(-20)
                .reverse()
                .map((event) => createActivityItem(event))
                .join('');
        }

        function createActivityItem(event) {
            let type = 'alert';
            let message = event.type;

            if (event.type.includes('buy') || event.type.includes('entry')) type = 'buy';
            if (event.type.includes('sell') || event.type.includes('exit')) type = 'sell';

            if (event.agentName) message = `[${event.agentName}] ${event.type}`;
            if (event.symbol) message += ` • ${event.symbol}`;

            const time = new Date(event.timestamp).toLocaleTimeString();

            return `
                <div class="activity-item ${type}">
                    <div>${message}</div>
                    <span class="activity-time">${time}</span>
                </div>
            `;
        }

        function renderHeader() {
            const runningAgents = Object.values(agents).filter((a) => a.isRunning).length;
            document.getElementById('activeAgents').textContent = Object.keys(agents).length;
            document.getElementById('execPerMin').textContent = Math.floor(events.length / ((Date.now() - startTime) / 60000));
        }

        function renderFooter() {
            const trades = events.filter((e) => e.type.includes('buy') || e.type.includes('sell')).length;
            document.getElementById('totalTrades').textContent = trades;

            const uptime = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(uptime / 3600);
            const minutes = Math.floor((uptime % 3600) / 60);
            document.getElementById('uptime').textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        // Start
        initWebSocket();
        setInterval(render, 1000);
    </script>
</body>
</html>
